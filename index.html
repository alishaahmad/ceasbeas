<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceaser Clearance Test</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- Background vibe -->
  <div class="bg" aria-hidden="true"></div>

  <!-- APP ROOT -->
  <main class="app">

    <!-- HEADER (stays) -->
    <header class="topbar">
      <div class="brand">
        <span class="paw">🐾</span>
        <span class="brandText">U think u a big dawg?</span>
      </div>

      <div class="hud" id="hud" hidden>
        <span class="hudItem"> Approval: <strong id="approval">50</strong></span>
        <span class="hudItem"> Ego: <strong id="ego">50</strong></span>
        <span class="hudItem"> Rage: <strong id="rage">0</strong></span>
      </div>
    </header>

    <!-- SCREEN CONTAINER -->
    <section class="screen" id="screen"></section>

  </main>

  <!-- POPUP / MODAL -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHeader">
        <div class="modalTitle" id="modalTitle">⚠️</div>
        <button class="iconBtn" id="modalClose" aria-label="Close">✕</button>
      </div>

      <div class="modalBody">
        <p class="modalText" id="modalText"></p>
        <img class="modalImg" id="modalImg" alt="" hidden />
      </div>

      <div class="modalFooter">
        <button class="btn primary" id="modalContinue">Continue</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
